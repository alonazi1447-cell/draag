<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دراج - توصيل سريع</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Tajawal,Arial;background:linear-gradient(160deg,#f5f0ff,#eaf7ef);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap');
.logo{font-size:52px;font-weight:900;background:linear-gradient(135deg,#7C3AED,#43A868);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;}
.sub{color:#888;font-size:14px;margin-bottom:30px;}
.btn{display:block;width:100%;max-width:340px;margin:10px auto;padding:18px;border:none;border-radius:16px;font-size:18px;font-weight:700;cursor:pointer;font-family:Tajawal,Arial;}
.btn-main{background:linear-gradient(135deg,#7C3AED,#9F67FF);color:white;}
.btn-store{background:white;border:2px solid #7C3AED;color:#7C3AED;}
.btn-driver{background:white;border:2px solid #43A868;color:#43A868;}
.btn-admin{background:white;border:2px solid #888;color:#555;}
</style>
</head>
<body>
<div class="logo">🚲 دراج</div>
<div class="sub">توصيل سريع • الخرج</div>
<button class="btn btn-main" onclick="go('client')">🛍️ اطلب من هنا</button>
<button class="btn btn-store" onclick="go('store')">🏪 محل تجاري</button>
<button class="btn btn-driver" onclick="go('driver')">🚲 مندوب</button>
<button class="btn btn-admin" onclick="go('admin')">📊 الإدارة</button>

<script>
function go(role){
  localStorage.setItem('drj_entry_role', role);
  window.location.href = '%D8%AF%D8%B1%D8%A7%D8%AC.html?role=' + role;
}
</script>
</body>
</html>
