<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار دراج</title>
<style>
body{margin:0;font-family:Arial;background:#f0f0f0;text-align:center;padding:20px;}
.btn{display:block;width:80%;margin:15px auto;padding:20px;background:#7C3AED;color:white;border:none;border-radius:15px;font-size:20px;cursor:pointer;}
#result{margin-top:20px;padding:15px;background:white;border-radius:10px;font-size:16px;}
</style>
</head>
<body>
<h2>🚲 اختبار دراج</h2>
<button class="btn" onclick="test('عميل')">🛍️ عميل</button>
<button class="btn" onclick="test('محل')">🏪 محل تجاري</button>
<button class="btn" onclick="test('مندوب')">🚲 مندوب</button>
<button class="btn" onclick="test('إدارة')">📊 الإدارة</button>
<div id="result">اضغط أي زر للاختبار</div>
<script>
function test(role){
  document.getElementById('result').innerHTML='✅ يعمل! اخترت: <strong>'+role+'</strong>';
  document.getElementById('result').style.background='#d4edda';
}
</script>
</body>
</html>
