<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5C518">
<title>دراج — توصيل سريع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --Y:#F5C518;--Y2:#FFD700;--Y3:#FFF8DC;
  --P:#7C3AED;--P2:#9F67FF;--P3:#F0EAFF;
  --G:#22C55E;--G2:#16A34A;--G3:#DCFCE7;
  --R:#EF4444;--R3:#FEE2E2;
  --bg:#F5F0FF;--card:#fff;--border:#E5E7EB;
  --text:#1E1B4B;--t2:#6B7280;--t3:#9CA3AF;
  --sh:0 2px 16px rgba(124,58,237,.1);--r:16px;--r2:12px;
}
html,body{height:100%;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);}
button{cursor:pointer;font-family:'Tajawal',sans-serif;border:none;outline:none;}
input,select{font-family:'Tajawal',sans-serif;outline:none;}
input:focus,select:focus{border-color:var(--P)!important;}
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.on{display:flex;}

/* HOME */
#sHome{background:linear-gradient(160deg,#EDE8FF,#F5F0FF,#FFF8DC);align-items:center;justify-content:center;padding:24px;}
.h-inner{width:100%;max-width:400px;}
.bike-wrap{width:100%;height:44px;overflow:hidden;position:relative;margin-bottom:10px;}
.bike{position:absolute;font-size:30px;animation:ride 2.8s linear infinite;top:7px;}
@keyframes ride{0%{right:-60px;opacity:0;}10%{opacity:1;}88%{opacity:1;}100%{right:108%;opacity:0;}}
.brand{text-align:center;margin-bottom:22px;}
.brand-name{font-size:40px;font-weight:900;background:linear-gradient(135deg,var(--P),var(--Y2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.brand-sub{font-size:13px;color:var(--t2);margin-top:4px;}
.btn-cl{width:100%;padding:22px;background:linear-gradient(135deg,var(--Y),var(--Y2));border-radius:20px;font-size:20px;font-weight:900;color:var(--text);box-shadow:0 8px 24px rgba(245,197,24,.4);margin-bottom:14px;transition:transform .15s;}
.btn-cl:active{transform:scale(.97);}
.btn-cl-icon{font-size:40px;margin-bottom:6px;}
.btn-cl-sub{font-size:12px;font-weight:500;opacity:.7;margin-top:3px;}
.roles{display:flex;gap:10px;}
.btn-role{flex:1;background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:14px 6px;text-align:center;transition:all .15s;font-size:26px;}
.btn-role:active{border-color:var(--P);background:var(--P3);}
.role-n{font-size:12px;font-weight:800;color:var(--text);margin-top:5px;}
.role-s{font-size:10px;color:var(--t3);margin-top:2px;}

/* AUTH */
#sAuth{background:var(--bg);}
.auth-hd{background:linear-gradient(135deg,var(--Y),var(--Y2));padding:40px 24px 24px;text-align:center;position:relative;}
.auth-ico{font-size:52px;margin-bottom:6px;}
.auth-ttl{font-size:20px;font-weight:900;color:var(--text);}
.auth-sub{font-size:12px;color:rgba(30,27,75,.6);margin-top:3px;}
.back-btn{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.3);border:none;border-radius:50%;width:34px;height:34px;font-size:17px;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.auth-bd{flex:1;padding:20px;max-width:460px;width:100%;margin:0 auto;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--t2);margin-bottom:5px;}
.field input,.field select{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:var(--r2);font-size:15px;background:var(--card);color:var(--text);}
.ltr{direction:ltr;text-align:center;letter-spacing:2px;}
.auth-tog{text-align:center;margin-top:10px;font-size:12px;color:var(--t2);}
.auth-tog button{background:none;color:var(--P);font-weight:800;font-size:12px;padding:3px;}

/* APP */
#sApp{background:var(--bg);}
.topbar{background:linear-gradient(135deg,var(--Y),var(--Y2));padding:13px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(245,197,24,.3);}
.tb-r{display:flex;align-items:center;gap:7px;}
.tb-logo{font-size:18px;font-weight:900;color:var(--text);}
.tb-badge{background:rgba(30,27,75,.12);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;color:var(--text);}
.tb-user{background:rgba(30,27,75,.12);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;color:var(--text);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-out{background:rgba(30,27,75,.12);border:none;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--text);}
.tabbar{background:var(--card);border-bottom:2px solid var(--border);padding:7px 10px;display:flex;gap:5px;overflow-x:auto;position:sticky;top:56px;z-index:99;}
.tabbar::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;color:var(--t2);cursor:pointer;white-space:nowrap;transition:all .15s;}
.tab.on{background:linear-gradient(135deg,var(--P),var(--P2));color:#fff;}
.abody{flex:1;overflow-y:auto;padding-bottom:80px;}
.panel{display:none;padding:14px;}
.panel.on{display:block;}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh);}
.card-ttl{font-size:14px;font-weight:800;color:var(--text);margin-bottom:10px;}
.srow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);}
.srow:last-child{border:none;}
.slbl{font-size:12px;color:var(--t2);}
.sval{font-size:13px;font-weight:800;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 14px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;border:none;}
.btn:active{transform:scale(.97);}
.btn-y{background:linear-gradient(135deg,var(--Y),var(--Y2));color:var(--text);}
.btn-p{background:linear-gradient(135deg,var(--P),var(--P2));color:#fff;}
.btn-g{background:linear-gradient(135deg,var(--G),var(--G2));color:#fff;}
.btn-r{background:var(--R);color:#fff;}
.btn-o{background:none;border:2px solid var(--border);color:var(--t2);}
.btn-op{background:none;border:2px solid var(--P);color:var(--P);}
.btn-full{width:100%;padding:13px;font-size:15px;border-radius:var(--r);}
.btn-sm{padding:6px 10px;font-size:11px;}

/* ORDER CARDS */
.ocard{background:var(--card);border-radius:var(--r);padding:13px;margin-bottom:9px;box-shadow:var(--sh);border-right:4px solid var(--border);}
.ocard.new{border-color:var(--Y);}
.ocard.confirmed{border-color:var(--P);}
.ocard.delivering{border-color:var(--G);}
.ocard.done{border-color:var(--t3);}
.oid{font-size:11px;color:var(--t3);margin-bottom:3px;}
.ostore{font-size:14px;font-weight:800;margin-bottom:3px;}
.oitems{font-size:11px;color:var(--t2);margin-bottom:7px;}
.ofoot{display:flex;align-items:center;justify-content:space-between;}
.ototal{font-size:15px;font-weight:900;color:var(--P);}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;}
.bn{background:var(--Y3);color:#92400E;}
.bc{background:var(--P3);color:var(--P);}
.bd{background:var(--G3);color:var(--G2);}
.bx{background:var(--border);color:var(--t3);}
.br{background:var(--R3);color:var(--R);}
.oacts{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;}

/* DRIVER REQUEST */
.dreq{background:linear-gradient(135deg,#FFF8DC,#FFFBEA);border:3px solid var(--Y);border-radius:20px;padding:20px;text-align:center;margin-bottom:12px;animation:glow 1.5s ease-in-out infinite;}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(245,197,24,.5);}50%{box-shadow:0 0 0 12px rgba(245,197,24,0);}}
.dbell{font-size:46px;animation:swing .4s ease-in-out infinite alternate;}
@keyframes swing{0%{transform:rotate(-15deg);}100%{transform:rotate(15deg);}}
.dstore{font-size:19px;font-weight:900;color:var(--P);margin:7px 0;}
.damt{font-size:30px;font-weight:900;}
.dcomm{font-size:13px;color:var(--G2);font-weight:700;}
.dcd{width:50px;height:50px;border-radius:50%;background:var(--P);color:#fff;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:9px auto;}
.dbtns{display:flex;gap:9px;margin-top:11px;}

/* TRACKING */
.tsteps{display:flex;justify-content:space-between;padding:14px 0;position:relative;}
.tsteps::before{content:'';position:absolute;top:26px;right:10%;left:10%;height:3px;background:var(--border);z-index:0;}
.tstep{display:flex;flex-direction:column;align-items:center;gap:3px;z-index:1;flex:1;}
.tdot{width:34px;height:34px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;}
.tdot.done{background:var(--G);color:#fff;}
.tdot.active{background:var(--P);color:#fff;box-shadow:0 0 0 4px var(--P3);}
.tlbl{font-size:10px;font-weight:700;color:var(--t3);text-align:center;}
.tlbl.on{color:var(--text);}

/* STORES GRID */
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.scard{background:var(--card);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--sh);cursor:pointer;border:2px solid transparent;transition:all .15s;}
.scard:active{border-color:var(--P);transform:scale(.98);}
.scard.closed{opacity:.5;}
.sico{font-size:36px;margin-bottom:6px;}
.snm{font-size:13px;font-weight:800;}
.sst{font-size:10px;margin-top:3px;font-weight:700;}
.sst.op{color:var(--G2);}
.sst.cl{color:var(--R);}

/* PRODUCTS */
.cat-nm{font-size:13px;font-weight:900;padding:7px 0;margin-top:6px;color:var(--text);}
.prow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
.prow:last-child{border:none;}
.pname{font-size:13px;font-weight:700;}
.pprice{font-size:12px;color:var(--t2);}
.qctrl{display:flex;align-items:center;gap:7px;}
.qbtn{width:27px;height:27px;border-radius:7px;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.qadd{background:linear-gradient(135deg,var(--Y),var(--Y2));color:var(--text);}
.qrem{background:var(--P3);color:var(--P);}
.qn{font-size:13px;font-weight:800;min-width:18px;text-align:center;}

/* CART FAB */
.cfab{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--P),var(--P2));color:#fff;padding:13px 26px;border-radius:28px;font-size:14px;font-weight:800;box-shadow:0 8px 24px rgba(124,58,237,.4);display:none;z-index:200;border:none;}

/* CART */
#sCart{background:var(--bg);}
.cart-hd{background:linear-gradient(135deg,var(--Y),var(--Y2));padding:40px 20px 18px;position:relative;}
.cart-ttl{font-size:20px;font-weight:900;color:var(--text);}
.cart-bd{padding:14px;}
.citem{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
.citem-n{font-size:13px;font-weight:700;}
.citem-p{font-size:12px;color:var(--t2);}
.csum{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:var(--sh);}
.csrow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;}
.csrow.tot{font-size:17px;font-weight:900;color:var(--P);border-top:2px solid var(--border);padding-top:9px;margin-top:3px;}
.note{background:var(--Y3);border:1.5px solid var(--Y2);border-radius:var(--r2);padding:11px;margin-bottom:10px;font-size:11px;color:#92400E;}

/* STATS */
.sgrid2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:10px;}
.scard2{background:var(--card);border-radius:var(--r);padding:13px;text-align:center;box-shadow:var(--sh);}
.snum{font-size:26px;font-weight:900;color:var(--P);}
.slbl2{font-size:11px;color:var(--t2);margin-top:3px;}

/* LOC MODALS */
#locM,#viewM{position:fixed;inset:0;z-index:600;display:none;flex-direction:column;}
#locM.on,#viewM.on{display:flex;}
.locH{padding:13px 14px;display:flex;align-items:center;justify-content:space-between;color:#fff;}
.locH.p{background:linear-gradient(135deg,var(--P),var(--P2));}
.locH.g{background:linear-gradient(135deg,var(--G),var(--G2));}
#locMap,#viewMap{flex:1;min-height:200px;}
.locC{background:var(--card);padding:13px;}
.locXbtn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:30px;height:30px;font-size:15px;cursor:pointer;}

/* TOAST */
.toast{position:fixed;top:66px;left:50%;transform:translateX(-50%) translateY(-20px);background:#1E1B4B;color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:700;z-index:999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.s{background:var(--G2);}
.toast.e{background:var(--R);}
.toast.w{background:#D97706;}

/* STARS */
.stars{display:flex;gap:7px;justify-content:center;margin:10px 0;}
.star{font-size:30px;cursor:pointer;filter:grayscale(1);transition:.15s;}
.star.on{filter:none;}
</style>
</head>
<body>

<!-- HOME -->
<div id="sHome" class="screen on">
  <div class="h-inner">
    <div class="bike-wrap"><span class="bike">🚲</span></div>
    <div class="brand">
      <div class="brand-name">🚲 دراج</div>
      <div class="brand-sub">توصيل سريع • الخرج</div>
    </div>
    <button class="btn-cl" onclick="A.auth('client')">
      <div class="btn-cl-icon">🛍️</div>
      <div>اطلب من هنا</div>
      <div class="btn-cl-sub">من أقرب المحلات لباب بيتك</div>
    </button>
    <div class="roles">
      <button class="btn-role" onclick="A.auth('store')">
        <div>🏪</div><div class="role-n">محل تجاري</div><div class="role-s">استقبل طلبات</div>
      </button>
      <button class="btn-role" onclick="A.auth('driver')">
        <div>🚲</div><div class="role-n">مندوب</div><div class="role-s">وصّل واكسب</div>
      </button>
      <button class="btn-role" onclick="A.auth('admin')">
        <div>📊</div><div class="role-n">الإدارة</div><div class="role-s">لوحة التحكم</div>
      </button>

  </div>
</div>

<!-- AUTH -->
<div id="sAuth" class="screen">
  <div class="auth-hd">
    <button class="back-btn" onclick="A.home()">←</button>
    <div class="auth-ico" id="authIco">🛍️</div>
    <div class="auth-ttl" id="authTtl">دخول</div>

<!-- APP -->
<div id="sApp" class="screen">

      <span class="tb-logo">🚲 دراج</span>

</div>

<!-- CART -->
<div id="sCart" class="screen">
  <div class="cart-hd">
    <button class="back-btn" onclick="A.showApp()">←</button>
    <div class="cart-ttl">🛒 مراجعة الطلب</div>
  </div>
  <div class="cart-bd">
    <div class="note">💡 <strong>خطوتان:</strong> استفسر أولاً عن التوفر، ثم أكّد الطلب النهائي</div>
    <div id="cItems"></div>
    <div id="cSum"></div>
    <button class="btn btn-op btn-full" style="margin-bottom:8px;" onclick="C.inquire()">💬 استفسار عبر واتساب</button>
    <button class="btn btn-y btn-full" onclick="C.confirm()">✅ تأكيد الطلب النهائي</button>
  </div>
</div>

<button class="cfab" id="cfab" onclick="A.showCart()">🛒 السلة <span id="cCount">0</span></button>
<div class="toast" id="toast"></div>

<!-- LOC PICKER -->
<div id="locM">
  <div class="locH p">
    <span id="locMTtl" style="font-size:15px;font-weight:900;">📍 تحديد الموقع</span>
    <button class="locXbtn" onclick="L.close()">✕</button>
  </div>
  <div id="locMap"></div>
  <div class="locC">
    <button class="btn btn-p btn-full" style="margin-bottom:7px;" onclick="L.auto()">🎯 تحديد موقعي تلقائياً</button>
    <div id="locPrev" style="font-size:11px;color:var(--t2);text-align:center;margin-bottom:7px;">اسحب الدبوس لتحديد الموقع</div>
    <button id="locConfBtn" class="btn btn-g btn-full" onclick="L.confirm()">✅ تأكيد الموقع</button>
  </div>
</div>

<!-- VIEW LOC -->
<div id="viewM">
  <div class="locH g">
    <span id="viewMTtl" style="font-size:15px;font-weight:900;">📍 موقع العميل</span>
    <button class="locXbtn" onclick="L.closeView()">✕</button>
  </div>
  <div id="viewMap"></div>
  <div class="locC">
    <div id="viewInf" style="font-size:12px;color:var(--t2);text-align:center;margin-bottom:9px;"></div>
    <a id="viewLnk" href="#" target="_blank" class="btn btn-p btn-full" style="text-decoration:none;display:flex;">🗺️ فتح في خرائط جوجل</a>
  </div>
</div>

<script>
'use strict';
<script>
// ===== CONFIG =====
const SUP_URL='https://ynmbqsrpanslrwnsfsxe.supabase.co';
const SUP_KEY='sb_publishable_xNLtHqpFrviChHhR3piTbA_OQ14ZzGD';
const ADMIN_PASS='admin123';
const FEE_CLIENT=5, FEE_STORE=2, MAX_KM=3;

// ===== STORAGE =====
const S={
  get:(k,d=null)=>{try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
  del:(k)=>{try{localStorage.removeItem(k);}catch{}}
};

// ===== SUPABASE =====
let db=null,DB=false;
function initDB(){
  try{
    db=window.supabase.createClient(SUP_URL,SUP_KEY);DB=true;
    db.channel('ord').on('postgres_changes',{event:'*',schema:'public',table:'drj_orders'},p=>{
      OD.load().then(()=>{
        if(ST.role==='store')Store.render();
        if(ST.role==='driver')Drv.check();
        if(ST.role==='client')Client.refreshTrack();
        if(ST.role==='admin')Admin.refresh();
      });
    }).subscribe();
    console.log('DB OK');
  }catch(e){DB=false;console.warn('DB off');}
}
async function dbQ(fn){return Promise.race([fn(),new Promise((_,r)=>setTimeout(()=>r(new Error('TO')),5000))]);}

// ===== STATE =====
const ST={role:null,user:null,storeId:null,cart:[],curStore:null,curDrvOrd:null,drvStats:{orders:0,earn:0},hb:null,poll:null,cd:null};

// ===== ORDERS =====
let orders=[];
const OD={
  async load(){
    if(DB){try{const{data}=await dbQ(()=>db.from('drj_orders').select('*').order('created_at',{ascending:false}).limit(200));if(data){orders=data.map(OD.map);S.set('drj_orders',orders);return;}}catch{}}
    orders=S.get('drj_orders',[]);
  },
  map:r=>({id:r.id,store:r.store,storeId:r.store_id,client:r.client,cPhone:r.client_phone,items:r.items,sub:r.subtotal,status:r.status,time:r.time,driver:r.driver,dPhone:r.driver_phone,dMs:r.delivery_ms,cLat:r.client_lat,cLng:r.client_lng,cAddr:r.client_address,skip:r.skipped_by||[],dRating:r.driver_rating,sRating:r.store_rating}),
  async save(o){
    orders=orders.filter(x=>x.id!==o.id);orders.unshift(o);S.set('drj_orders',orders);
    if(!DB)return;

let actx=null,bell=null;
function ac(){if(!actx||actx.state==='closed')actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
function bip(f,t,d,v,tp='sine'){try{const x=ac(),o=x.createOscillator(),g=x.createGain();o.connect(g);g.connect(x.destination);o.type=tp;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.05);}catch{}}
const SND={
  store(){try{const x=ac(),t=x.currentTime;[0,1.3,2.6].forEach(d=>{bip(1047,t+d,.6,.5);bip(784,t+d+.08,.5,.25);});}catch{}if(navigator.vibrate)navigator.vibrate([400,200,400,200,400]);this._loop(()=>this.store(),5000);},
  driver(){try{const x=ac(),t=x.currentTime;[440,550,660,880,1100].forEach((f,i)=>bip(f,t+i*.09,.14,.5,'square'));[1100,880,660,550,440].forEach((f,i)=>bip(f,t+.55+i*.09,.12,.4,'square'));}catch{}if(navigator.vibrate)navigator.vibrate([500,200,500,200,500]);this._loop(()=>this.driver(),5000);},
  admin(){try{const x=ac(),t=x.currentTime;bip(880,t,.15,.35);bip(880,t+.3,.15,.35);}catch{}},
  order(){try{const x=ac(),t=x.currentTime;[523,659,784].forEach((f,i)=>bip(f,t+i*.12,.25,.3));}catch{}},
  confirm(){try{const x=ac(),t=x.currentTime;[523,659,784,1047].forEach((f,i)=>bip(f,t+i*.12,.3,.35));}catch{}},
  arrive(){try{const x=ac(),t=x.currentTime;[523,659,784,1047,1319].forEach((f,i)=>bip(f,t+i*.1,.3,.4));}catch{}},
  stop(){if(bell){clearInterval(bell);bell=null;}},
  _loop(fn,ms){this.stop();bell=setInterval(fn,ms);setTimeout(()=>this.stop(),90000);}
};

      <div class="card"><div class="card-ttl">📞 بيانات الاتصال</div>

        <div class="field"><label>الرقم السري الحالي</label><input id="stOld" type="password" maxlength="4" inputmode="numeric" placeholder="••••" class="ltr"></div>
